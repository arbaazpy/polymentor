services:
  - type: web
    name: polymentor
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: >-
      uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
      --worker-class gthread --workers 2 --threads 8 --timeout 180
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://polymentor.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: polymentor-db
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: NUGEN_API_KEY
        sync: false
      - key: ADMIN_BEARER_TOKEN
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: polymentor-db
    plan: free
